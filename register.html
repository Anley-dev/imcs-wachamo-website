<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | IMCS Wachemo</title>
    <link href="https://fonts.googleapis.com/css2 family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR CONTAINER -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fas fa-cross cross-icon"></i> IMCS <span>Wachemo</span></a>
        </div>
    </nav>

    <!-- AUTHENTICATION FORM WRAPPER -->
    <section class="auth-section">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the Wachemo University Pax Romana Community</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-name" placeholder="Enter full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-email">University Email / Personal Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="student@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Minimum 6 characters" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary auth-submit-btn">Register Membership</button>
            </form>
            
            <p class="auth-footer">Already a registered user? <a href="login.html">Sign In Here</a></p>
        </div>
    </section>

    <!-- MODULAR AUTH HOOK -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
