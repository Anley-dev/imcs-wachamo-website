
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
    <style>
        .post-form { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .posts-list { margin-top: 30px; }
        .post-item { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p>Executive Council Control Center</p>

        <!-- Create Post -->
        <div class="post-form">
            <h2>Post News / Announcements</h2>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="post-title" placeholder="e.g. Monthly Spiritual Retreat">
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea id="post-content" rows="5" placeholder="Write announcement here..."></textarea>
            </div>
            <button onclick="publishPost()" class="btn btn-primary" style="background:#10b981; padding:12px 24px;">Publish Post</button>
        </div>

        <!-- Published Posts -->
        <div class="posts-list">
            <h2>Published Posts</h2>
            <div id="posts-container">No posts yet.</div>
        </div>
    </main>

    <script>
        import { onAuthStateChanged, getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });

        // Publish Post
        function publishPost() {
            const title = document.getElementById("post-title").value.trim();
            const content = document.getElementById("post-content").value.trim();

            if (!title || !content) {
                alert("Please fill both title and content.");
                return;
            }

            const posts = JSON.parse(localStorage.getItem("imcs_posts") || "[]");
            posts.unshift({
                id: Date.now(),
                title: title,
                content: content,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem("imcs_posts", JSON.stringify(posts));
            alert("✅ Post published successfully!");
            
            // Clear form
            document.getElementById("post-title").value = "";
            document.getElementById("post-content").value = "";
            
            loadPosts();
        }

        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem("imcs_posts") || "[]");
            const container = document.getElementById("posts-container");
            
            if (posts.length === 0) {
                container.innerHTML = "<p>No posts published yet.</p>";
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-item">
                    <strong>${post.title}</strong>
                    <small style="display:block; color:#666; margin:8px 0;">${post.date}</small>
                    <p>${post.content}</p>
                </div>
            `).join("");
        }

        // Load posts on page load
        window.onload = loadPosts;
    </script>
</body>
</html>
