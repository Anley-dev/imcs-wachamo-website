
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p>Executive Council Control Center</p>

        <!-- Post News -->
        <div class="app-card">
            <h2>Post News / Announcements</h2>
            <input type="text" id="post-title" placeholder="Post Title" style="width:100%; padding:12px; margin:10px 0;">
            <textarea id="post-content" rows="4" placeholder="Write announcement..." style="width:100%; padding:12px;"></textarea>
            <button onclick="publishPost()" style="background:#10b981; color:white; padding:14px 30px; border:none; border-radius:8px;">Publish Post</button>
        </div>

        <!-- Manage Members -->
        <div class="app-card">
            <h2>Manage Members</h2>
            <button onclick="loadMembers()" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">View All Members</button>
            <div id="members-list" style="margin-top:20px;"></div>
        </div>

        <!-- Events Management -->
        <div class="app-card">
            <h2>Events Management</h2>
            <input type="text" id="event-title" placeholder="Event Title" style="width:100%; padding:12px; margin:8px 0;">
            <input type="date" id="event-date" style="width:100%; padding:12px; margin:8px 0;">
            <textarea id="event-desc" rows="3" placeholder="Event description" style="width:100%; padding:12px;"></textarea>
            <button onclick="saveEvent()" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">Save Event</button>
            <div id="events-list" style="margin-top:25px;"></div>
        </div>

        <!-- Published Posts with Edit/Delete -->
        <div class="app-card">
            <h2>Published Posts</h2>
            <div id="posts-container">Loading posts...</div>
        </div>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxD9h4BBPNbbuepLTEyQIesMj44eEqdNA",
            authDomain: "imcs-wachamo.firebaseapp.com",
            projectId: "imcs-wachamo",
            storageBucket: "imcs-wachamo.firebasestorage.app",
            messagingSenderId: "445125483030",
            appId: "1:445125483030:web:2eaa94ecac7a13ef0fb337"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });

        // Publish Post
        async function publishPost() {
            const title = document.getElementById("post-title").value.trim();
            const content = document.getElementById("post-content").value.trim();
            if (!title || !content) return alert("Fill title and content");

            await addDoc(collection(db, "announcements"), {
                title, content, createdAt: serverTimestamp()
            });

            alert("✅ Post Published!");
            document.getElementById("post-title").value = "";
            document.getElementById("post-content").value = "";
        }

        // Real-time Posts with Edit & Delete
        const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById("posts-container");
            let html = "";
            snapshot.forEach((doc) => {
                const post = doc.data();
                const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : "Recent";
                html += `
                    <div class="app-card" style="margin-bottom:15px; position:relative;">
                        <strong>${post.title}</strong><br>
                        <small>${date}</small>
                        <p style="margin:12px 0;">${post.content}</p>
                        <button onclick="deletePost('${doc.id}')" style="position:absolute; top:15px; right:15px; background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px;">Delete</button>
                    </div>
                `;
            });
            container.innerHTML = html || "<p>No posts yet.</p>";
        });

        window.deletePost = async function(id) {
            if (confirm("Delete this post?")) {
                await deleteDoc(doc(db, "announcements", id));
            }
        };

        // Members & Events (basic for now)
        function loadMembers() {
            document.getElementById("members-list").innerHTML = `<p><strong>Registered Members:</strong><br>• Anley Belay (Admin)</p>`;
        }

        function saveEvent() {
            alert("Events saved to Firestore - Coming in next update");
        }
    </script>
</body>
</html>
