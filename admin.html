
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p class="subtitle">Executive Council Control Center</p>

        <!-- Post News -->
        <div class="app-card">
            <h2>Post News / Announcements</h2>
            <div class="form-group">
                <input type="text" id="post-title" placeholder="Post Title" required>
            </div>
            <div class="form-group">
                <textarea id="post-content" rows="5" placeholder="Write announcement here..." required></textarea>
            </div>
            <button onclick="publishPost()" class="btn btn-primary">Publish Post</button>
        </div>

        <!-- Manage Members -->
        <div class="app-card">
            <h2>Manage Members</h2>
            <p>View and manage registered members.</p>
            <button onclick="viewMembers()" class="btn btn-secondary">View All Members</button>
            <div id="members-list" style="margin-top: 15px;"></div>
        </div>

        <!-- Events Management -->
        <div class="app-card">
            <h2>Events Management</h2>
            <p>Create and manage upcoming events.</p>
            <button onclick="alert('Events Management - Coming Soon')" class="btn btn-secondary">Manage Events</button>
        </div>

        <!-- Published Posts -->
        <div class="app-card">
            <h2>Published Posts</h2>
            <div id="posts-container">No posts yet.</div>
        </div>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });

        // Publish Post
        function publishPost() {
            const title = document.getElementById("post-title").value.trim();
            const content = document.getElementById("post-content").value.trim();

            if (!title || !content) {
                alert("Please fill both Title and Content");
                return;
            }

            let posts = JSON.parse(localStorage.getItem("imcs_announcements") || "[]");
            posts.unshift({
                id: Date.now(),
                title,
                content,
                date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            });

            localStorage.setItem("imcs_announcements", JSON.stringify(posts));
            alert(" Post Published Successfully!");

            document.getElementById("post-title").value = "";
            document.getElementById("post-content").value = "";
            loadPosts();
        }

        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem("imcs_announcements") || "[]");
            const container = document.getElementById("posts-container");

            if (posts.length === 0) {
                container.innerHTML = "<p>No posts published yet.</p>";
                return;
            }

            container.innerHTML = posts.map(post => `
                <div style="background:#f8fafc; padding:20px; margin:12px 0; border-radius:12px;">
                    <strong>${post.title}</strong><br>
                    <small>${post.date}</small>
                    <p style="margin-top:10px;">${post.content}</p>
                </div>
            `).join('');
        }

        function viewMembers() {
            document.getElementById("members-list").innerHTML = `
                <p><strong>Registered Members:</strong></p>
                <ul><li>Anley Belay (Admin)</li><li>Other Members...</li></ul>
            `;
        }

        // Load posts on page load
        window.onload = loadPosts;
    </script>
</body>
</html>
