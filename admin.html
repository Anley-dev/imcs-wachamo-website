
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p>Executive Council Control Center</p>

        <!-- Post News -->
        <div class="app-card">
            <h2>Post News / Announcements</h2>
            <input type="text" id="post-title" placeholder="Post Title" style="width:100%; padding:12px; margin:10px 0;">
            <textarea id="post-content" rows="5" placeholder="Write announcement..." style="width:100%; padding:12px;"></textarea>
            <button onclick="publishPost()" style="background:#10b981; color:white; padding:14px 28px; border:none; border-radius:8px; margin-top:10px;">
                Publish Post
            </button>
        </div>

        <!-- Manage Members -->
        <div class="app-card">
            <h2>Manage Members</h2>
            <p>View and manage registered members.</p>
            <button onclick="alert('Member management coming soon! (Firestore integration)')" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">
                View All Members
            </button>
        </div>

        <!-- Events Management -->
        <div class="app-card">
            <h2>Events Management</h2>
            <p>Create and manage upcoming events.</p>
            <button onclick="alert('Events management coming soon!')" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">
                Manage Events
            </button>
        </div>

        <!-- Published Posts -->
        <div class="app-card">
            <h2>Published Posts</h2>
            <div id="posts-container">Loading posts...</div>
        </div>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxD9h4BBPNbbuepLTEyQIesMj44eEqdNA",
            authDomain: "imcs-wachamo.firebaseapp.com",
            projectId: "imcs-wachamo",
            storageBucket: "imcs-wachamo.firebasestorage.app",
            messagingSenderId: "445125483030",
            appId: "1:445125483030:web:2eaa94ecac7a13ef0fb337"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });

        // Publish Post to Firestore
        async function publishPost() {
            const title = document.getElementById("post-title").value.trim();
            const content = document.getElementById("post-content").value.trim();

            if (!title || !content) {
                alert("Please fill Title and Content");
                return;
            }

            try {
                await addDoc(collection(db, "announcements"), {
                    title: title,
                    content: content,
                    createdAt: serverTimestamp(),
                    author: "Admin"
                });
                alert(" Post Published Successfully!");
                document.getElementById("post-title").value = "";
                document.getElementById("post-content").value = "";
            } catch (error) {
                alert("Error publishing post: " + error.message);
            }
        }

        // Real-time listener
        const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById("posts-container");
            let html = "";
            snapshot.forEach(doc => {
                const post = doc.data();
                html += `
                    <div style="background:white; padding:20px; margin:12px 0; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                        <strong>${post.title}</strong><br>
                        <small>${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : 'Just now'}</small>
                        <p style="margin-top:10px;">${post.content}</p>
                    </div>
                `;
            });
            container.innerHTML = html || "<p>No posts yet.</p>";
        });
    </script>
</body>
</html>
