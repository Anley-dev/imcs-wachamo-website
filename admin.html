
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p>Executive Council Control Center</p>

        <!-- Post News -->
        <div class="app-card">
            <h2>Post News / Announcements</h2>
            <input type="text" id="post-title" placeholder="Post Title" style="width:100%; padding:12px; margin:10px 0;">
            <textarea id="post-content" rows="5" placeholder="Write announcement..." style="width:100%; padding:12px;"></textarea>
            <button onclick="publishPost()" style="background:#10b981; color:white; padding:14px 30px; border:none; border-radius:8px;">
                Publish Post
            </button>
        </div>

        <!-- Manage Members -->
        <div class="app-card">
            <h2>Manage Members</h2>
            <button onclick="loadMembers()" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">
                View All Members
            </button>
            <div id="members-list" style="margin-top:20px;"></div>
        </div>

        <!-- Events Management (Functional) -->
        <div class="app-card">
            <h2>Events Management</h2>
            <input type="text" id="event-title" placeholder="Event Title" style="width:100%; padding:12px; margin:10px 0;">
            <input type="date" id="event-date" style="width:100%; padding:12px; margin:10px 0;">
            <textarea id="event-desc" rows="3" placeholder="Event description..." style="width:100%; padding:12px;"></textarea>
            <button onclick="createEvent()" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">
                Create Event
            </button>
            <div id="events-list" style="margin-top:20px;"></div>
        </div>

        <!-- Published Posts -->
        <div class="app-card">
            <h2>Published Posts</h2>
            <div id="posts-container">No posts yet.</div>
        </div>
    </main>

    <script>
        let editingPostId = null;

        // Publish Post
        function publishPost() {
            const title = document.getElementById("post-title").value.trim();
            const content = document.getElementById("post-content").value.trim();
            if (!title || !content) return alert("Fill title and content");

            let posts = JSON.parse(localStorage.getItem("imcs_posts") || "[]");
            posts.unshift({ id: Date.now(), title, content, date: new Date().toLocaleDateString() });
            localStorage.setItem("imcs_posts", JSON.stringify(posts));
            alert("✅ Post Published!");
            document.getElementById("post-title").value = "";
            document.getElementById("post-content").value = "";
            loadPosts();
        }

        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem("imcs_posts") || "[]");
            const container = document.getElementById("posts-container");
            container.innerHTML = posts.map(p => `
                <div style="background:#f8fafc; padding:20px; margin:12px 0; border-radius:12px;">
                    <strong>${p.title}</strong><br>
                    <small>${p.date}</small>
                    <p>${p.content}</p>
                </div>
            `).join('') || "<p>No posts yet.</p>";
        }

        // Create Event
        function createEvent() {
            const title = document.getElementById("event-title").value.trim();
            const date = document.getElementById("event-date").value;
            const desc = document.getElementById("event-desc").value.trim();

            if (!title || !date) return alert("Title and Date are required");

            let events = JSON.parse(localStorage.getItem("imcs_events") || "[]");
            events.unshift({ id: Date.now(), title, date, desc });
            localStorage.setItem("imcs_events", JSON.stringify(events));

            alert("✅ Event Created!");
            document.getElementById("event-title").value = "";
            document.getElementById("event-date").value = "";
            document.getElementById("event-desc").value = "";
            loadEvents();
        }

        function loadEvents() {
            const events = JSON.parse(localStorage.getItem("imcs_events") || "[]");
            const container = document.getElementById("events-list");
            container.innerHTML = events.map(e => `
                <div style="background:#f0f9ff; padding:15px; margin:10px 0; border-radius:8px;">
                    <strong>\( {e.title}</strong> <small>( \){e.date})</small>
                    <p>${e.desc}</p>
                </div>
            `).join('') || "<p>No events scheduled yet.</p>";
        }

        function loadMembers() {
            document.getElementById("members-list").innerHTML = `
                <p><strong>Registered Members:</strong></p>
                <ul><li>Anley Belay (Admin)</li></ul>
            `;
        }

        window.onload = () => {
            loadPosts();
            loadEvents();
        };
    </script>
</body>
</html>
