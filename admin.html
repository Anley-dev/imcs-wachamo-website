
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p>Executive Council Control Center</p>

        <!-- Post News -->
        <div class="app-card">
            <h2>Post News / Announcements</h2>
            <input type="text" id="post-title" placeholder="Post Title" style="width:100%; padding:12px; margin:10px 0;">
            <textarea id="post-content" rows="5" placeholder="Write announcement..." style="width:100%; padding:12px;"></textarea>
            <button id="publishBtn" onclick="publishPost()" style="background:#10b981; color:white; padding:14px 30px; border:none; border-radius:8px; margin-top:10px;">Publish Post</button>
            <div id="post-message" class="message"></div>
        </div>

        <!-- Events -->
        <div class="app-card">
            <h2>Events Management</h2>
            <input type="text" id="event-title" placeholder="Event Title" style="width:100%; padding:12px; margin:8px 0;">
            <input type="date" id="event-date" style="width:100%; padding:12px; margin:8px 0;">
            <textarea id="event-desc" rows="3" placeholder="Description" style="width:100%; padding:12px;"></textarea>
            <button id="eventBtn" onclick="createEvent()" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">Create Event</button>
        </div>

        <!-- Members -->
        <div class="app-card">
            <h2>Manage Members</h2>
            <button onclick="loadMembers()" style="background:#3b82f6; color:white; padding:12px 24px; border:none; border-radius:8px;">View All Members</button>
            <div id="members-list" style="margin-top:20px;"></div>
        </div>

        <!-- Published Posts -->
        <div class="app-card">
            <h2>Published Posts</h2>
            <div id="posts-container">Loading...</div>
        </div>
    </main>

    <!-- Firebase v9 SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/admin.js"></script>
</body>
</html>
