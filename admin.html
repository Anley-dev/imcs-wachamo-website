
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p>Executive Council Control Center</p>

        <!-- Post News -->
        <div class="app-card">
            <h2>Post News / Announcements</h2>
            <input type="text" id="post-title" placeholder="Post Title" style="width:100%; padding:12px; margin:10px 0;">
            <textarea id="post-content" rows="5" placeholder="Write announcement..." style="width:100%; padding:12px;"></textarea>
            <button onclick="publishPost()" style="background:#10b981; color:white; padding:14px 30px; border:none; border-radius:8px;">
                Publish New Post
            </button>
        </div>

        <!-- Published Posts with Edit & Delete -->
        <div class="app-card">
            <h2>Published Posts</h2>
            <div id="posts-container">Loading posts...</div>
        </div>
    </main>

    <script>
        let currentEditingId = null;

        function publishPost() {
            const title = document.getElementById("post-title").value.trim();
            const content = document.getElementById("post-content").value.trim();

            if (!title || !content) return alert("Fill title and content");

            let posts = JSON.parse(localStorage.getItem("imcs_announcements") || "[]");

            if (currentEditingId) {
                // Update existing post
                const post = posts.find(p => p.id === currentEditingId);
                if (post) {
                    post.title = title;
                    post.content = content;
                }
                currentEditingId = null;
                document.querySelector("button[onclick='publishPost()']").textContent = "Publish New Post";
            } else {
                // Create new post
                posts.unshift({
                    id: Date.now(),
                    title: title,
                    content: content,
                    date: new Date().toLocaleDateString()
                });
            }

            localStorage.setItem("imcs_announcements", JSON.stringify(posts));
            alert("✅ Post Saved Successfully!");

            document.getElementById("post-title").value = "";
            document.getElementById("post-content").value = "";
            loadPosts();
        }

        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem("imcs_announcements") || "[]");
            const container = document.getElementById("posts-container");

            if (posts.length === 0) {
                container.innerHTML = "<p>No posts yet.</p>";
                return;
            }

            container.innerHTML = posts.map(post => `
                <div style="background:#f8fafc; padding:20px; margin:12px 0; border-radius:12px; position:relative;">
                    <strong>${post.title}</strong><br>
                    <small>${post.date}</small>
                    <p style="margin:12px 0;">${post.content}</p>
                    <div style="position:absolute; top:15px; right:15px;">
                        <button onclick="editPost(${post.id})" style="margin-right:8px; background:#3b82f6; color:white; border:none; padding:6px 12px; border-radius:6px;">Edit</button>
                        <button onclick="deletePost(${post.id})" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        window.editPost = function(id) {
            const posts = JSON.parse(localStorage.getItem("imcs_announcements") || "[]");
            const post = posts.find(p => p.id === id);
            if (post) {
                document.getElementById("post-title").value = post.title;
                document.getElementById("post-content").value = post.content;
                currentEditingId = id;
                document.querySelector("button[onclick='publishPost()']").textContent = "Update Post";
            }
        };

        window.deletePost = function(id) {
            if (confirm("Delete this post?")) {
                let posts = JSON.parse(localStorage.getItem("imcs_announcements") || "[]");
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem("imcs_announcements", JSON.stringify(posts));
                loadPosts();
            }
        };

        window.onload = loadPosts;
    </script>
</body>
</html>
