
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="admin.html" class="active">Admin Panel</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="workspace-container">
        <h1>Admin Panel</h1>
        <p style="color: #475569;">Executive Council Control Center</p>

        <div class="app-grid">
            <div class="app-card">
                <h2>Post News / Announcements</h2>
                <p>Manage and publish news for all members.</p>
                <button class="btn btn-primary">Create New Post</button>
            </div>

            <div class="app-card">
                <h2>Manage Members</h2>
                <p>View, approve, and manage registered members.</p>
                <button class="btn btn-primary">View All Members</button>
            </div>

            <div class="app-card">
                <h2>Events Management</h2>
                <p>Create and manage upcoming events.</p>
                <button class="btn btn-primary">Manage Events</button>
            </div>
        </div>
    </main>

    <script>
        import { onAuthStateChanged, getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
