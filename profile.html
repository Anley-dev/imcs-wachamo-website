<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile | IMCS Wachemo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="profile-body">

    <!-- PROTECTED NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fas fa-cross cross-icon"></i> IMCS <span>Wachemo</span></a>
            <a href="#" id="profile-logout-btn" class="nav-btn dynamic-logout-style"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <!-- MAIN PROFILE DASHBOARD CONTAINER -->
    <main class="profile-container">
        <!-- Initial hidden state to prevent UI flashing during authentication handshake -->
        <div id="profile-loading-card" class="profile-loading">
            <i class="fas fa-circle-notch fa-spin"></i>
            <p>Verifying secure session tokens...</p>
        </div>

        <div id="profile-main-card" class="profile-card structural-hide">
            <div class="profile-header-block">
                <div class="profile-avatar-wrapper">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2 id="user-display-email">Loading Member Identity...</h2>
                <span class="status-badge"><i class="fas fa-shield-alt"></i> Active Member</span>
            </div>

            <hr class="profile-divider">

            <div class="profile-details-grid">
                <div class="detail-item">
                    <label>Account Reference ID</label>
                    <p id="user-display-uid">---</p>
                </div>
                <div class="detail-item">
                    <label>Campus Hub Location</label>
                    <p>Wachemo University Main Campus</p>
                </div>
                <div class="detail-item">
                    <label>Session Established</label>
                    <p id="user-display-signin">---</p>
                </div>
            </div>

            <div class="profile-actions-wrapper">
                <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Return to Main Hub</a>
            </div>
        </div>
    </main>

    <!-- CLIENT ROUTE GUARD CONTROLLER LINK -->
    <script type="module" src="js/profile.js"></script>
</body>
</html>
