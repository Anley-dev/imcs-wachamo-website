
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile | IMCS Wachemo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fas fa-cross"></i> IMCS <span>Wachemo</span></a>
            <a href="#" id="logout-btn" class="nav-btn">Logout</a>
        </div>
    </nav>

    <main style="padding: 20px; max-width: 600px; margin: 0 auto;">
        <h1>My Profile</h1>
        <div id="profile-content">
            <p><strong>Name:</strong> <span id="user-name">Loading...</span></p>
            <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
        </div>
    </main>

    <script>
        import { onAuthStateChanged, getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("user-name").textContent = user.displayName || "Member";
                document.getElementById("user-email").textContent = user.email;
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
