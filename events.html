
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <header style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 80px 20px; text-align: center;">
        <h1>Upcoming Events</h1>
        <p>IMCS Wachemo University Activities</p>
    </header>

    <main class="workspace-container">
        <div id="events-container">
            <p>Loading events...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxD9h4BBPNbbuepLTEyQIesMj44eEqdNA",
            authDomain: "imcs-wachamo.firebaseapp.com",
            projectId: "imcs-wachamo",
            storageBucket: "imcs-wachamo.firebasestorage.app",
            messagingSenderId: "445125483030",
            appId: "1:445125483030:web:2eaa94ecac7a13ef0fb337"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        // Real-time Events
        const q = query(collection(db, "events"), orderBy("date", "asc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById("events-container");
            let html = "";

            if (snapshot.empty) {
                container.innerHTML = "<p>No upcoming events. Check back later.</p>";
                return;
            }

            snapshot.forEach(doc => {
                const event = doc.data();
                html += `
                    <div class="app-card" style="margin-bottom: 25px;">
                        <h2>${event.title}</h2>
                        <small>📅 ${event.date}</small>
                        <p style="margin:15px 0;">${event.desc}</p>
                        <button onclick="rsvp('${doc.id}')" style="background:#10b981; color:white; padding:12px 24px; border:none; border-radius:8px;">
                            RSVP
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        });
    </script>
</body>
</html>
