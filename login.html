<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | IMCS Wachemo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- NAVBAR CONTAINER -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fas fa-cross"></i> IMCS</a>
        </div>
    </nav>

    <!-- SIGN IN FORM WRAPPER -->
    <section class="auth-section">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your member portal dashboard</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Registered Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
            </form>

            <p class="auth-footer">New to the community? <a href="register.html">Create an account</a></p>
        </div>
    </section>

    <!-- 1. Firebase Core and Auth SDK Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- 2.  Local Credentials Config -->
    <script src="config.js"></script>

    <!-- 3.Authentication Script (No type="module") -->
    <script src="js/auth.js"></script>
</body>
</html>
