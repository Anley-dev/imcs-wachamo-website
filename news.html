
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Announcements | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="news.html" class="active">News</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <header style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 80px 20px; text-align: center;">
        <h1>News & Announcements</h1>
        <p>Latest updates from IMCS Wachemo Community</p>
    </header>

    <main class="workspace-container">
        <div id="news-container">
            <p>Loading latest news...</p>
        </div>
    </main>

    <script>
        function loadNews() {
            const posts = JSON.parse(localStorage.getItem("imcs_posts") || "[]");
            const container = document.getElementById("news-container");

            if (posts.length === 0) {
                container.innerHTML = "<p>No announcements yet. The Executive Council will post soon.</p>";
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="app-card" style="margin-bottom: 25px;">
                    <h2>${post.title}</h2>
                    <small style="color:#64748b;">${post.date}</small>
                    <p style="margin-top: 15px; line-height: 1.7;">${post.content}</p>
                </div>
            `).join('');
        }

        window.onload = loadNews;
    </script>
</body>
</html>
