<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Announcements | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .news-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #3b82f6;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .news-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e3a8a;
            margin: 0 0 10px 0;
        }
        .news-date {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .news-content {
            color: #374151;
            line-height: 1.6;
            font-size: 1rem;
        }
        .news-author {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .no-news {
            background: #f9fafb;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #6b7280;
        }
    </style>
</head>
<body id="newsBody" class="auth-gate-locked">

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="news.html" class="active">News</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <header style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 40px 20px; text-align: center;">
        <h1 style="margin: 0; font-size: 2.5rem;">📰 News & Announcements</h1>
        <p style="margin: 10px 0 0 0; font-size: 1.1rem;">Latest updates from IMCS Wachemo Community</p>
    </header>

    <main class="workspace-container">
        <div id="news-container" class="loading">
            <p>⏳ Loading latest news...</p>
        </div>
    </main>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxD9h4BBPNbbuepLTEyQIesMj44eEqdNA",
            authDomain: "imcs-wachamo.firebaseapp.com",
            projectId: "imcs-wachamo",
            storageBucket: "imcs-wachamo.firebasestorage.app",
            messagingSenderId: "445125483030",
            appId: "1:445125483030:web:2eaa94ecac7a13ef0fb337"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getFirestore(app);
        const auth = getAuth(app);
        const newsBodyNode = document.getElementById("newsBody");

        // Enable local persistence for better session continuity
        setPersistence(auth, browserLocalPersistence)
            .catch((error) => console.error("Persistence Setup Failure:", error));

        let isFirstHandshakeCheck = true;
        let hasResolvedAuth = false;

        onAuthStateChanged(auth, (user) => {
            hasResolvedAuth = true;

            if (user) {
                console.log("Firebase Auth Success: Session valid for account:", user.email);
                
                if (newsBodyNode) {
                    newsBodyNode.classList.remove("auth-gate-locked");
                    newsBodyNode.classList.add("auth-gate-unlocked");
                }
                
                // Load news only after authentication is confirmed
                loadNews();
                isFirstHandshakeCheck = false;
            } else {
                if (isFirstHandshakeCheck) {
                    isFirstHandshakeCheck = false;
                    console.log("Auth handshake pending token verification... waiting for local storage resolve.");

                    setTimeout(() => {
                        if (!auth.currentUser && !window.location.pathname.includes("login.html")) {
                            console.warn("Firebase Auth Guard: Token missing after grace period. Redirecting...");
                            if (newsBodyNode) newsBodyNode.classList.remove("auth-gate-locked");
                            window.location.href = "login.html";
                        }
                    }, 2000);
                } else {
                    console.warn("Firebase Auth Guard: Missing user token payload. Redirecting back to gateway...");
                    if (newsBodyNode) newsBodyNode.classList.remove("auth-gate-locked");
                    if (!window.location.pathname.includes("login.html")) {
                        window.location.href = "login.html";
                    }
                }
            }
        });

        // Logout button handler
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", async () => {
                if (confirm("Are you sure you want to logout?")) {
                    try {
                        await signOut(auth);
                        window.location.href = "index.html";
                    } catch (error) {
                        console.error("Logout error:", error);
                    }
                }
            });
        }

        // Load news function
        function loadNews() {
            onSnapshot(query(collection(db, "news"), orderBy("createdAt", "desc")), (snapshot) => {
                const container = document.getElementById("news-container");
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="no-news"><p>📭 No news available yet</p></div>';
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const post = doc.data();
                    const date = post.createdAt 
                        ? new Date(post.createdAt.toDate()).toLocaleString() 
                        : "Recently";
                    
                    html += `
                        <div class="news-card">
                            <h2 class="news-title">${escapeHtml(post.title)}</h2>
                            <div class="news-date">📅 ${date}</div>
                            <div class="news-content">${escapeHtml(post.content)}</div>
                            <div class="news-author">By ${escapeHtml(post.author || 'IMCS Wachemo')}</div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            }, (error) => {
                console.error("Error loading news:", error);
                document.getElementById("news-container").innerHTML = 
                    '<div class="no-news"><p>❌ Error loading news. Please refresh the page.</p></div>';
            });
        }

        // Helper function to prevent XSS
        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
