
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Announcements | IMCS Wachemo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-cross"></i> IMCS <span class="brand-accent">Wachemo</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="news.html" class="active">News</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <header style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 90px 20px; text-align: center;">
        <h1>News & Announcements</h1>
        <p>Latest updates from the IMCS Wachemo Community</p>
    </header>

    <main class="workspace-container">
        <div id="news-container">
            <p>Loading latest news...</p>
        </div>
        <div id="error-container" style="display: none; color: #dc2626; padding: 15px; background: #fee2e2; border-radius: 8px; margin-top: 15px;"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxD9h4BBPNbbuepLTEyQIesMj44eEqdNA",
            authDomain: "imcs-wachamo.firebaseapp.com",
            projectId: "imcs-wachamo",
            storageBucket: "imcs-wachamo.firebasestorage.app",
            messagingSenderId: "445125483030",
            appId: "1:445125483030:web:2eaa94ecac7a13ef0fb337"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                const container = document.getElementById("news-container");
                const errorContainer = document.getElementById("error-container");
                let html = "";

                console.log("Snapshot received. Empty:", snapshot.empty, "Size:", snapshot.size);

                if (snapshot.empty) {
                    container.innerHTML = "<p>No announcements yet. Check back later.</p>";
                    errorContainer.style.display = "none";
                    return;
                }

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    console.log("Post data:", post);
                    
                    const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    }) : "Recent";

                    html += `
                        <div class="app-card" style="margin-bottom: 25px;">
                            <h2>${post.title || "Untitled"}</h2>
                            <small style="color:#64748b;">${date}</small>
                            <p style="margin-top: 15px; line-height: 1.7;">${post.content || "No content"}</p>
                        </div>
                    `;
                });

                container.innerHTML = html;
                errorContainer.style.display = "none";
            }, (error) => {
                console.error("Firestore error:", error);
                const errorContainer = document.getElementById("error-container");
                errorContainer.textContent = "Error loading announcements: " + error.message;
                errorContainer.style.display = "block";
            });

        } catch (error) {
            console.error("Firebase initialization error:", error);
            const errorContainer = document.getElementById("error-container");
            errorContainer.textContent = "Firebase error: " + error.message;
            errorContainer.style.display = "block";
        }
    </script>
</body>
</html>
